[project]
name = "fdi_pln_2614_p1"
version = "2.0"
description = "Agente de negociación autónoma para la Práctica 1 de PLN"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dynaconf",
    "loguru",
    "pydantic",
    "pydantic-ai",
    "click",
    "rich",
    "fastapi[standard]>=0.115.0",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fdi_pln_2614_p1"]

[project.scripts]
fdi-pln-2614-p1 = "fdi_pln_2614_p1.main:cli"
