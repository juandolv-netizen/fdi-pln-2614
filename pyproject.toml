[project]
name = "fdi-pln-2614-p5"
version = "1.0"
description = "Práctica 5 de PLN - Generación Causal y Clasificación NER"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch==2.2.2+cu118",
    "click>=8.1.7",
    "typer>=0.12.3",
    "loguru>=0.7.3",
    "rich>=13.7.1",
    "dynaconf>=3.2.5",
    "python-dotenv>=1.0.1",
    "numpy<2",
]

[project.scripts]
fdi-pln-2614-p5 = "fdi_pln_2614_p5.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["*.py"]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu118"